# Done to increase the memory available to gradle. (do we need the first two lines?)
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home

# Fabric Properties
# check these on https://fabricmc.net/develop
# 26.1 is the first unobfuscated Minecraft version: no Yarn mappings, and it requires Java 25.
minecraft_version=26.1.2
loader_version=0.19.3

# Mod Properties
# minecraft_version below is the version we COMPILE/dev against; the published jar declares a wider
# 26.1.x range in fabric.mod.json (>=26.1 <26.2), since 26.1 is unobfuscated and the API is stable
# across the patch line — one jar covers 26.1, 26.1.1, 26.1.2.
mod_version=2.0.0+26.1.x
maven_group=net.nosam08.enchantmaxxing
archives_base_name=enchantmaxxing

# Dependencies
fabric_version=0.152.1+26.1.2
cloth_config=26.1.154
owo_version=0.13.0+26.1
mod_menu=18.0.0-beta.1
