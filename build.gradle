plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.11'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/enchantify.accesswidener")
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	maven { url = "https://api.modrinth.com/maven" } // WalksyLib
	maven { url = "https://maven.terraformersmc.com/releases/" } //mod menu
	maven { url = "https://maven.wispforest.io" } // owo
	maven { url = "https://jitpack.io" } // kdl4j, a transitive dependency of owo-lib 0.13.0+

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

// Multi-version libraries (owo, mod menu, cloth) can transitively request a Fabric API
// built for a newer Minecraft version, and Gradle's conflict resolution would pick that
// higher version — which then refuses to load on our target MC. Pin Fabric API to the
// version declared in gradle.properties so the runtime always matches minecraft_version.
configurations.all {
	resolutionStrategy {
		force "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	// 26.1+ is unobfuscated, so there is no mappings line and Loom does not remap mods.
	// That means mod dependencies are plain implementation/api deps (no mod* configurations).
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// WalksyLib — builder-based config library that supplies the ModMenu config screen.
	// Pulled from the Modrinth maven; excludes Fabric API so our pinned version wins (see resolutionStrategy above).
	implementation("maven.modrinth:walksylib:${project.walksylib_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

	//Mod Menu
	api "com.terraformersmc:modmenu:${project.mod_menu}"

	// owo-lib (includes owo-ui)
	implementation "io.wispforest:owo-lib:${project.owo_version}"
    include "io.wispforest:owo-sentinel:${project.owo_version}"
}

processResources {
    inputs.properties([
        "version": project.version,
		"loader_version": project.loader_version,
        "minecraft_version": project.minecraft_version,
        "fabric_version": project.fabric_version,
        "walksylib_version": project.walksylib_version,
        "owo_version": project.owo_version,
        "mod_menu": project.mod_menu
    ])

    filesMatching("fabric.mod.json") {
        expand([
            "version": project.version,
			"loader_version": project.loader_version,
            "minecraft_version": project.minecraft_version,
            "fabric_version": project.fabric_version,
            "walksylib_version": project.walksylib_version,
            "owo_version": project.owo_version,
            "mod_menu": project.mod_menu
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// 26.1 is the first unobfuscated Minecraft version and requires Java 25+. The build compiles
	// with whatever JDK launches Gradle, so make sure that JDK is 25 or newer (release = 25 above
	// keeps the emitted bytecode at the Java-25 floor regardless of a newer compiler).
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
